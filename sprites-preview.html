<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vector Beat · Sprites animados</title><style>*{box-sizing:border-box}body{margin:0;background:#f9eee8;color:#614764;font-family:Trebuchet MS,sans-serif;padding:30px}main{max-width:1000px;margin:auto}h1{margin:0 0 8px}p{line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:#fff9;border:1px solid white;padding:20px;border-radius:24px;text-align:center}canvas{width:100%;background:linear-gradient(#ddd5f0,#fae4db);border-radius:15px;max-height:250px}button{background:#89ccbc;color:#24483e;border:0;padding:12px 22px;border-radius:22px;font:inherit;cursor:pointer}a{color:#6e4b87}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><main><h1>◇ Vector Beat · Sprites animados</h1><p>Cuatro cuadros por elemento, con fondo transparente. El trampolín reacciona al botón; los demás se repiten al ritmo de 92,5 BPM.</p><div class="grid"><section class="card"><h2>Cono cozy</h2><canvas id="cone-sprites" width="440" height="250"></canvas></section><section class="card"><h2>Trampolín con resortes</h2><canvas id="trampoline-sprites" width="440" height="250"></canvas><p><button id="bounce">Probar rebote ↟</button></p></section><section class="card"><h2>Fogata pequeña</h2><canvas id="fire-sprites" width="440" height="250"></canvas></section><section class="card"><h2>Plataforma flotante floral</h2><canvas id="floating-platform-sprites" width="440" height="250"></canvas></section></div><p><a href="index.html">Abrir el juego →</a></p></main><script>const assets={"cone-sprites": {"file": "cone-sprites.png", "frameCount": 4, "frames": [[84, 167, 377, 417], [627, 167, 377, 417], [1170, 167, 377, 417], [1713, 167, 377, 417]], "anchor": "bottom-center", "framesPerBeat": 4, "triggered": false}, "trampoline-sprites": {"file": "trampoline-sprites.png", "frameCount": 4, "frames": [[26, 232, 499, 296], [569, 232, 499, 296], [1112, 232, 499, 296], [1655, 232, 499, 296]], "anchor": "bottom-center", "framesPerBeat": 4, "triggered": true}, "fire-sprites": {"file": "fire-sprites.png", "frameCount": 4, "frames": [[59, 65, 455, 571], [602, 65, 455, 571], [1145, 65, 455, 571], [1688, 65, 455, 571]], "anchor": "bottom-center", "framesPerBeat": 8, "triggered": false}, "floating-platform-sprites": {"file": "floating-platform-sprites.png", "frameCount": 4, "frames": [[20, 242, 503, 271], [563, 242, 503, 271], [1106, 242, 503, 271], [1649, 242, 503, 271]], "anchor": "bottom-center", "framesPerBeat": 2, "triggered": false}};let triggered=-100;const images={};for(const [name,data]of Object.entries(assets)){images[name]=new Image();images[name].src=data.file}document.getElementById('bounce').onclick=()=>triggered=performance.now()/1000;function render(ms){const t=ms/1000,beat=t/(60/92.5);for(const[name,data]of Object.entries(assets)){const c=document.getElementById(name),g=c.getContext('2d');g.clearRect(0,0,440,250);const age=t-triggered;let index=data.triggered?(age>=0&&age<.10?1:age>=.10&&age<.30?2:age>=.30&&age<.52?3:0):Math.floor(beat*data.framesPerBeat)%4;if(images[name].complete&&images[name].naturalWidth){let frame=data.frames[index],w=name==='floating-platform-sprites'?330:name==='trampoline-sprites'?280:150,h=w*frame[3]/frame[2];if(h>200){w*=200/h;h=200}g.drawImage(images[name],...frame,(440-w)/2,225-h,w,h)}}requestAnimationFrame(render)}requestAnimationFrame(render);</script></html>
